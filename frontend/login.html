<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Papel y Luna — Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icono {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .logo h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .logo p {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .campo {
            margin-bottom: 1rem;
        }

        .campo label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #1a1a1a;
            background: #fafafa;
            transition: border-color 0.2s;
            outline: none;
        }

        .campo input:focus {
            border-color: #6c63ff;
            background: #fff;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-login:hover   { background: #574fd6; }
        .btn-login:active  { transform: scale(0.98); }
        .btn-login:disabled {
            background: #b0aee8;
            cursor: not-allowed;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #ffcdd2;
            color: #c0392b;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error.visible { display: block; }

        .hint {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
        }

        .hint p {
            font-size: 0.78rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 4px;
        }

        .hint .usuario {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #999;
            background: #f8f8f8;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .hint .usuario span:first-child { font-weight: 500; }
    </style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        <span class="logo-icono">🌙</span>
        <h1>Papel y Luna</h1>
        <p>Sistema de punto de venta</p>
    </div>

    <div class="error" id="error-msg"></div>

    <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@pos.com" autocomplete="email">
    </div>

    <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login">Iniciar sesión</button>

    <div class="hint">
        <p>Usuarios de prueba:</p>
        <div class="usuario">
            <span>👑 Admin</span>
            <span>admin@pos.com / admin123</span>
        </div>
        <div class="usuario" style="margin-top: 4px;">
            <span>🧾 Cajero</span>
            <span>cajero@pos.com / cajero123</span>
        </div>
    </div>

</div>

<script type="module">
    import { iniciarSesion } from './js/database.js';

    const btnLogin  = document.getElementById('btn-login');
    const errorMsg  = document.getElementById('error-msg');
    const inputEmail    = document.getElementById('email');
    const inputPassword = document.getElementById('password');

    // Si ya hay sesión activa, ir directo al POS
    if (localStorage.getItem('pos_token')) {
        window.location.href = 'index.html';
    }

    async function login() {
        const email    = inputEmail.value.trim();
        const password = inputPassword.value;

        if (!email || !password) {
            mostrarError('Completa todos los campos.');
            return;
        }

        btnLogin.disabled    = true;
        btnLogin.textContent = 'Ingresando...';
        errorMsg.classList.remove('visible');

        try {
            await iniciarSesion(email, password);
            window.location.href = 'index.html';
        } catch (err) {
            mostrarError(err.message || 'Credenciales incorrectas.');
            btnLogin.disabled    = false;
            btnLogin.textContent = 'Iniciar sesión';
        }
    }

    function mostrarError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
    }

    btnLogin.addEventListener('click', login);

    // También funciona presionando Enter
    [inputEmail, inputPassword].forEach(input => {
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    });
</script>

</body>
</html>
